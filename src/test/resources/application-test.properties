# Test configuration - no external dependencies required

spring.application.name=brew-buddy-back-test

# Test database (H2 in-memory or provide test values)
spring.datasource.url=jdbc:postgresql://localhost:5432/brewbuddy_test
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Management
management.health.db.enabled=false
management.endpoints.web.exposure.include=health

# Test values for required env vars
auth.service.url=http://localhost:8081
auth.jwt.secret=test-secret-key-minimum-32-characters-long-for-testing-only-brew-buddy
supabase.url=https://test.supabase.co
supabase.service.role.key=test-service-role-key
cors.allowed.origins=http://localhost:3000
