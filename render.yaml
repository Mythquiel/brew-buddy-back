services:
  - type: web
    name: brew-buddy-back
    runtime: docker
    plan: free
    region: oregon
    branch: master
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AUTH_SERVICE_URL
        sync: false
      - key: AUTH_JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GMAIL_APP_USERNAME
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
    healthCheckPath: /actuator/health
